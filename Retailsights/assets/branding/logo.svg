<svg width="240" height="80" viewBox="0 0 240 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="80" rx="8" fill="url(#gradient-bg)"/>
  
  <!-- Icon: Shopping Cart with AI Brain -->
  <g transform="translate(16, 20)">
    <!-- Shopping Cart -->
    <path d="M8 4H10L13 16H26L29 8H12" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="15" cy="22" r="2" fill="#FFFFFF"/>
    <circle cx="24" cy="22" r="2" fill="#FFFFFF"/>
    
    <!-- AI Brain Overlay -->
    <g opacity="0.8">
      <circle cx="20" cy="12" r="8" fill="none" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="2 2"/>
      <circle cx="20" cy="12" r="2" fill="#06B6D4"/>
      <line x1="20" y1="12" x2="24" y2="8" stroke="#06B6D4" stroke-width="1"/>
      <line x1="20" y1="12" x2="24" y2="16" stroke="#06B6D4" stroke-width="1"/>
      <line x1="20" y1="12" x2="16" y2="8" stroke="#06B6D4" stroke-width="1"/>
      <circle cx="24" cy="8" r="1.5" fill="#06B6D4"/>
      <circle cx="24" cy="16" r="1.5" fill="#06B6D4"/>
      <circle cx="16" cy="8" r="1.5" fill="#06B6D4"/>
    </g>
  </g>
  
  <!-- Text: RetailSight -->
  <text x="60" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">
    Retail
  </text>
  <text x="122" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#06B6D4">
    Sight
  </text>
  
  <!-- Tagline -->
  <text x="60" y="52" font-family="Arial, sans-serif" font-size="10" fill="#E0E7FF" opacity="0.9">
    Intelligent Retail Platform
  </text>
  
  <!-- Enterprise Badge -->
  <rect x="185" y="25" width="45" height="16" rx="8" fill="#8B5CF6"/>
  <text x="190" y="36" font-family="Arial, sans-serif" font-size="8" font-weight="600" fill="#FFFFFF">
    ENTERPRISE
  </text>
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradient-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0E7490;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
