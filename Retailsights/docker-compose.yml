version: '3.8'
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: retailsight_db
      MYSQL_USER: retailsight_user
      MYSQL_PASSWORD: change-me
    ports:
      - '3306:3306'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  app:
    build: .
    env_file:
      - .env
    ports:
      - '8501:8501'
    depends_on:
      db:
        condition: service_healthy
